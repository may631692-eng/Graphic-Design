<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Graphic Design</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet"><style id="css">
:root{--bg:#fff;--card:#fbf6f1;--tx:#3b2417;--mut:#7a6254;--bd:#e6d6c8;--ac:#6f4528;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c110a;--card:#2a1a10;--tx:#f6ece3;--mut:#b9a090;--bd:#44301f;--ac:#d09a66;--on:#1c110a}}
:root[data-theme="dark"]{--bg:#1c110a;--card:#2a1a10;--tx:#f6ece3;--mut:#b9a090;--bd:#44301f;--ac:#d09a66;--on:#1c110a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 "Hind Siliguri",system-ui,"Noto Sans Bengali",sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:14px 0}
.logo{width:48px;height:48px;object-fit:contain;flex:none}
header select{margin-inline-start:auto}
select,input{background:var(--card);border:1.5px solid var(--bd);border-radius:8px;padding:7px 10px;min-height:40px}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#acct{position:relative}
.login,.btn2{background:var(--tx);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-weight:700;font-size:18px;cursor:pointer}
#menu{position:absolute;inset-inline-end:0;top:52px;width:250px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:8px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#menu small{display:block;color:var(--mut);overflow-wrap:anywhere}
#menu .who{padding:6px 8px 8px;border-bottom:1px solid var(--bd);margin-bottom:4px}
#menu button{display:block;width:100%;text-align:start;background:none;border:0;padding:9px 8px;border-radius:8px;cursor:pointer}
#menu button:hover{background:var(--bg)}
#menu .lbl{color:var(--mut);font-size:13px;padding:6px 8px 0}
#menu button.cur{font-weight:700;color:var(--ac)}
.hero{padding:18px 0 14px;border-bottom:3px solid var(--tx)}
h1{margin:0;font-size:clamp(44px,13vw,104px);line-height:1;font-weight:700;letter-spacing:-.03em}
.tag{margin:10px 0 0;font-size:clamp(18px,4.5vw,26px);font-weight:600;color:var(--ac)}
.chips{display:flex;gap:6px;margin-top:12px}
.chips i{width:34px;height:10px;border-radius:5px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0}
.filters label{display:flex;align-items:center;gap:8px}
.filters input{width:84px}
#note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:8px;color:var(--mut)}
#note button{background:none;border:1.5px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:720px){#grid{grid-template-columns:repeat(3,1fr);gap:18px}}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.art{--c:#8b5a2b;aspect-ratio:4/3;position:relative;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 35%,#fff));display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;text-shadow:0 1px 6px rgba(0,0,0,.35);text-align:center;padding:8px}
.fav{position:absolute;inset-inline-end:8px;bottom:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#c2255c;font-size:22px;cursor:pointer;line-height:1}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.body h3{margin:0;font-size:16px;font-weight:600}
.pr{margin:0 0 8px;color:var(--mut)}
.buy{margin-top:auto;text-align:center;text-decoration:none;background:var(--ac);color:var(--on);font-weight:700;border-radius:8px;padding:9px;min-height:40px}
.empty{grid-column:1/-1;color:var(--mut);padding:24px 0}
.more{text-align:center;padding:20px 0}
.more button{background:none;border:1.5px solid var(--tx);border-radius:8px;padding:9px 24px;cursor:pointer;font-weight:600}
.info{border-top:3px solid var(--tx);margin-top:10px;padding:20px 0 6px;max-width:62ch}
.info p{margin:0 0 10px;font-size:18px}
footer{padding:10px 0 32px}
footer h2{font-size:22px;margin:0 0 10px}
.soc{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.soc a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--tx);border:1.5px solid var(--bd);background:var(--card);border-radius:999px;padding:8px 16px 8px 10px;min-height:44px}
.soc b{width:28px;height:28px;border-radius:50%;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-size:14px}
#modal,#mailbox,#pw,#panel{position:fixed;inset:0;background:rgba(10,12,30,.55);display:grid;place-items:center;padding:16px;z-index:10}
#modal[hidden],#mailbox[hidden],#pw[hidden],#panel[hidden],#menu[hidden],#more[hidden]{display:none}
.box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:360px}
.box h2{margin:0 0 6px}
.box p{margin:0 0 12px;color:var(--mut)}
.box input{width:100%;margin-bottom:10px}
.opt{display:block;width:100%;text-align:center;text-decoration:none;border:1.5px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;font-weight:600;color:var(--tx);background:var(--card);cursor:pointer;min-height:44px}
.opt.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.adm{text-align:center;padding:0 0 28px}
.adm button{background:none;border:0;color:var(--mut);font-size:13px;cursor:pointer;padding:8px 14px;min-height:36px;text-decoration:underline}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#pv{width:96px;height:96px;object-fit:cover;border-radius:8px}
.wide{max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
.addf{display:grid;gap:8px;margin-bottom:12px}.addf input,.addf select{margin:0;width:100%}
.pi{display:grid;grid-template-columns:48px 1fr 80px 40px;gap:6px;align-items:center;margin-bottom:8px}
.pi input{margin:0}.pi img,.pi .ph{width:48px;height:48px;object-fit:cover;border-radius:6px;background:var(--bd)}
.del{background:none;border:1.5px solid var(--bd);border-radius:8px;min-height:40px;cursor:pointer}
.row{display:flex;gap:8px;justify-content:flex-end}
.row button{border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;border:1.5px solid var(--bd);background:none}
.row .btn2{border:0}
</style></head><body><template id="shell">

const LANGS=[["bn","বাংলা"],["en","English"],["hi","हिन्दी"],["ur","اردو"],["ar","العربية"],["es","Español"],["fr","Français"],["zh","中文"],["tr","Türkçe"],["id","Bahasa Indonesia"]];

const MAIL={bn:{t:"ইমেইল পাঠান",app:"Mail অ্যাপে খুলুন",gm:"Gmail-এ খুলুন",cp:"অ্যাড্রেস কপি করুন",cl:"বন্ধ করুন",ok:"কপি হয়েছে",sel:"সিলেক্ট হয়েছে, এবার কপি করুন"},en:{t:"Send an email",app:"Open in Mail app",gm:"Open in Gmail",cp:"Copy address",cl:"Close",ok:"Copied",sel:"Selected, now copy it"}};
const TAG={bn:"ডিজাইন বানান আপনার মনের মতো",en:"Make designs the way you like",hi:"अपने मन का डिज़ाइन बनाइए",ur:"اپنی پسند کا ڈیزائن بنائیں",ar:"صمّم بالطريقة التي تحبها",es:"Crea diseños a tu gusto",fr:"Créez des designs à votre goût",zh:"按你的心意设计",tr:"İstediğin gibi tasarla",id:"Buat desain sesuai keinginanmu"};
const DATA=JSON.parse(document.getElementById("data").textContent);const D=DATA.designs;
const S={lang:store.get("lang","bn"),profiles:store.get("profiles",[]),cur:store.get("cur",-1),n:6,saved:false,pending:null};
const me=()=>S.profiles[S.cur];
const persist=()=>{store.set("lang",S.lang);store.set("profiles",S.profiles);store.set("cur",S.cur)};
const li=()=>S.lang==="bn"?1:2;

function render(){
  const t=L[S.lang];
  document.documentElement.lang=S.lang;document.documentElement.dir=["ar","ur"].includes(S.lang)?"rtl":"ltr";$("#lang").innerHTML=LANGS.map(([k,n])=>`<option value="${k}">${n}</option>`).join("");$("#lang").value=S.lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  const fill=(el,all,arr)=>{const v=el.value;el.innerHTML=`<option value="">${all}</option>`+arr.map(a=>`<option value="${a[0]}">${a[li()]}</option>`).join("");el.value=v};
  fill($("#typ"),t.allT,TY);
  $("#nm").placeholder=t.nm;$("#em").placeholder=t.em;
  $("#fb").href=C.fb;$("#wa").href="https://wa.me/"+C.wa;$("#ml").onclick=e=>{
    e.preventDefault();const m=MAIL[S.lang]||MAIL.en;
    $("#mt").textContent=m.t;$("#maddr").textContent=C.mail;
    $("#m1").textContent=m.app;$("#m1").href="mailto:"+C.mail;
    $("#m2").textContent=m.gm;$("#m2").href="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(C.mail);
    $("#m3").textContent=m.cp;$("#m4").textContent=m.cl;$("#mailbox").hidden=false;
  };
  $("#m3").onclick=async()=>{const m=MAIL[S.lang]||MAIL.en;
    try{await navigator.clipboard.writeText(C.mail);$("#m3").textContent=m.ok}
    catch(e){const r=document.createRange();r.selectNodeContents($("#maddr"));const g=getSelection();g.removeAllRanges();g.addRange(r);$("#m3").textContent=m.sel}};
  $("#m4").onclick=()=>{$("#mailbox").hidden=true};
  $("#mailbox").onclick=e=>{if(e.target.id==="mailbox")$("#mailbox").hidden=true};$("#yt").href=C.yt;$("#tt").href=C.tt;$("#li").href=C.li;
  $("#tag").textContent=TAG[S.lang]||TAG.en;
  acct();grid();
}
function acct(){
  const t=L[S.lang],m=me();
  if(!m){$("#acct").innerHTML=`<button class="login" id="lg">${t.login}</button>`;$("#lg").onclick=()=>openModal(null);return}
  const others=S.profiles.length>1?`<div class="lbl">${t.sw}</div>`+S.profiles.map((p,i)=>`<button data-p="${i}" class="${i===S.cur?"cur":""}">${esc(p.name)}<small>${esc(p.email)}</small></button>`).join(""):"";
  $("#acct").innerHTML=`<button class="avatar" id="av" aria-label="Profile">${esc(m.name.trim().charAt(0).toUpperCase()||"?")}</button><div id="menu" hidden><div class="who"><b>${esc(m.name)}</b><small>${esc(m.email)}</small></div>${others}<button id="np">${t.newp}</button><button id="sv">${t.sv}</button><button id="lo">${t.out}</button></div>`;
  $("#av").onclick=e=>{e.stopPropagation();$("#menu").hidden=!$("#menu").hidden};
  $("#np").onclick=()=>{$("#menu").hidden=true;openModal(null)};
  $("#sv").onclick=()=>{S.saved=true;S.n=6;render()};
  $("#lo").onclick=()=>{S.cur=-1;S.saved=false;persist();render()};
  $("#menu").onclick=e=>{const b=e.target.closest("[data-p]");if(b){S.cur=+b.dataset.p;persist();render()}};
}
function grid(){
  const t=L[S.lang],m=me(),ty=$("#typ").value,min=parseFloat($("#pmin").value),max=parseFloat($("#pmax").value);
  const list=D.filter(d=>(!ty||d.type===ty)&&(isNaN(min)||d.p>=min)&&(isNaN(max)||d.p<=max)&&(!S.saved||(m&&m.saved.includes(d.id))));
  $("#grid").innerHTML=list.length?list.slice(0,S.n).map(d=>{
    const name=esc(d.name),sv=m&&m.saved.includes(d.id);
    return `<article class="card"><div class="art">${d.img?`<img class="pic" alt="${name}" src="${d.img}">`:`<span>${name}</span>`}<button class="fav" data-id="${d.id}" aria-label="Save">${sv?"♥":"♡"}</button></div><div class="body"><h3>${name}</h3><p class="pr">৳${d.p}</p><a class="buy" target="_blank" rel="noopener" href="https://wa.me/${C.wa}">${t.buy}</a></div></article>`}).join(""):`<p class="empty">${t.empty}</p>`;
  $("#more").hidden=list.length<=S.n;
  $("#note").innerHTML=S.saved?`<span>${t.shows}</span><button id="back">${t.all}</button>`:"";
  if(S.saved)$("#back").onclick=()=>{S.saved=false;S.n=6;grid()};
}
function openModal(pending){
  S.pending=pending;$("#hint").textContent=L[S.lang][pending===null?"hint0":"hint"];
  $("#modal").hidden=false;$("#nm").focus();
}
$("#form").onsubmit=e=>{
  e.preventDefault();
  const name=$("#nm").value.trim(),email=$("#em").value.trim().toLowerCase();
  let i=S.profiles.findIndex(p=>p.email===email);
  if(i<0){S.profiles.push({name,email,saved:[]});i=S.profiles.length-1}
  S.cur=i;
  if(S.pending!==null&&!me().saved.includes(S.pending))me().saved.push(S.pending);
  S.pending=null;$("#modal").hidden=true;$("#form").reset();persist();render();
};
$("#cancel").onclick=()=>{$("#modal").hidden=true;$("#form").reset()};
$("#grid").onclick=e=>{
  const b=e.target.closest(".fav");if(!b)return;
  const id=+b.dataset.id,m=me();
  if(!m){openModal(id);return}
  const k=m.saved.indexOf(id);k<0?m.saved.push(id):m.saved.splice(k,1);
  persist();grid();
};
$("#more").onclick=()=>{S.n+=6;grid()};
$("#lang").onchange=e=>{S.lang=e.target.value;persist();render()};
["#pmin","#pmax","#typ"].forEach(s=>$(s).addEventListener("input",()=>{S.n=6;grid()}));
document.addEventListener("click",e=>{const m=$("#menu");if(m&&!m.hidden&&!e.target.closest("#acct"))m.hidden=true});

const PWH="6886ba4c10d9ea079d893f325fbb8357d1ea9f97b95c07c40a6d63e1e765f195";
const HEAD=`<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Graphic Design</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">`;
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
const getArt=async()=>{try{return window.claude&&claude.use?await claude.use("artifact"):null}catch(e){return null}};
let W=[],PIC="";
async function takePic(f){try{PIC=await shrink(f);$("#pv").src=PIC;$("#pv").hidden=false;$("#pfl").textContent="✔ ছবি নেওয়া হয়েছে (বদলাতে চাপুন)";$("#pst").textContent=""}catch(e){PIC="";$("#pst").textContent="ছবিটি পড়া যায়নি। অন্য ছবি দিন।"}}
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.82))};im.onerror=no;im.src=u})}
function pl(){$("#pl").innerHTML=W.map((w,i)=>`<div class="pi" data-i="${i}">${w.img?`<img src="${w.img}" alt="">`:`<span class="ph"></span>`}<input class="in" value="${esc(w.name)}"><input class="ip" type="number" min="0" value="${w.p}"><button type="button" class="del" aria-label="Delete">✕</button></div>`).join("")}
function buildDoc(){
  const g=id=>document.getElementById(id),E="<\/script>";
  return "<!doctype html>\n<html lang=\"bn\"><head>"+HEAD+"<style id=\"css\">"+g("css").textContent+"</style></head><body><template id=\"shell\">"+g("shell").innerHTML+"</template><script type=\"application/json\" id=\"data\">"+JSON.stringify(DATA).replace(/</g,"\\u003c")+E+"<script id=\"code\">"+g("code").textContent+E+"</body></html>";
}
async function openPanel(){
  W=D.map(d=>({...d}));
  $("#pt").innerHTML=TY.map(a=>`<option value="${a[0]}">${a[1]}</option>`).join("");
  pl();
  $("#pst").textContent=(await getArt())?"সেভ ও পাবলিশ করলে সবার জন্য পেজ আপডেট হবে।":"সেভ করতে আপনার claude.ai অ্যাকাউন্টে login থাকা অবস্থায় এই পেজ খুলুন।";
  $("#panel").hidden=false;
}
$("#adm").onclick=()=>{$("#pwe").textContent="";$("#pwi").value="";$("#pw").hidden=false;$("#pwi").focus()};
$("#pwc").onclick=()=>{$("#pw").hidden=true};
$("#pwf").onsubmit=async e=>{
  e.preventDefault();let ok=false;
  try{ok=(await sha($("#pwi").value))===PWH}catch(x){}
  if(!ok){$("#pwe").textContent="পাসওয়ার্ড ভুল";return}
  $("#pw").hidden=true;openPanel();
};
const say=t=>{$("#pst").textContent=t;$("#pst2").textContent=t};
function addItem(){
  const n=$("#pn").value.trim(),ps=$("#pp").value.trim(),p=parseInt(ps,10);
  if(!PIC&&!n&&!ps)return true;
  if(isNaN(p)){say("দাম লিখুন, তারপর আবার চেষ্টা করুন।");$("#pp").focus();return false}
  W.unshift({id:DATA.next++,name:n||"Design "+DATA.next,p,type:$("#pt").value,img:PIC});
  PIC="";$("#pf").value=$("#pn").value=$("#pp").value="";$("#pv").hidden=true;$("#pfl").textContent="📷 গ্যালারি থেকে ছবি নিন";pl();
  return true;
}
$("#pa").onclick=()=>{if(addItem())say("যোগ হয়েছে। এখন নিচের “সেভ ও পাবলিশ করুন” চাপুন।")};
$("#pl").oninput=e=>{const r=e.target.closest(".pi");if(!r)return;const w=W[+r.dataset.i];
  if(e.target.classList.contains("in"))w.name=e.target.value;else if(e.target.classList.contains("ip"))w.p=parseInt(e.target.value,10)||0};
$("#pl").onclick=e=>{const b=e.target.closest(".del");if(!b)return;W.splice(+b.closest(".pi").dataset.i,1);pl()};
$("#pf").onchange=()=>{const f=$("#pf").files[0];if(f)takePic(f)};
$("#panel").addEventListener("paste",e=>{const f=[...((e.clipboardData&&e.clipboardData.files)||[])].find(x=>x.type.startsWith("image/"));if(f)takePic(f)});
$("#px").onclick=()=>{$("#panel").hidden=true};
$("#ps").onclick=async()=>{
  if(!addItem())return;
  const art=await getArt();
  if(!art){say("সেভ করার সুবিধা পাওয়া যায়নি। claude.ai-তে login আছে কিনা দেখে পেজটি আবার খুলুন।");return}
  DATA.designs=W.filter(w=>w.name);
  say("সেভ হচ্ছে… একটু অপেক্ষা করুন।");
  try{await art.publish(buildDoc())}
  catch(e){const c=e&&e.code;say(c==="not_writer"||c==="not_granted"?"এই অ্যাকাউন্টে পেজ পরিবর্তনের অনুমতি নেই।":c==="too_large"?"ছবি বেশি হয়ে গেছে, কিছু ডিজাইন মুছুন।":c==="conflict"?"":"সেভ হয়নি ("+(c||"?")+"), আবার চেষ্টা করুন।")}
};

render();</script></body></html>
